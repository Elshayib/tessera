[workspace]
resolver = "2"
members = ["crates/tessera-engine", "crates/tessera-provider", "crates/tessera-view", "crates/tessera-session"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
